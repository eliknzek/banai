<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" /><!-- the share link carries a token -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BanAI Wardrobe Designer</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
  </head>
  <body>
    <a class="skip-link" href="#properties-panel">Skip to properties</a>
    <header class="topbar">
      <h1 class="topbar__title" id="topbar-logo" aria-label="BanAI Wardrobe Designer"></h1>
      <div class="topbar__actions">
        <div class="theme-slider">
          <label class="theme-slider__label" for="theme-slider">Theme</label>
          <input type="range" id="theme-slider" min="0" max="4" step="1" value="0" />
          <output class="theme-slider__name" id="theme-name" for="theme-slider">Terracotta</output>
        </div>
        <label class="toggle">
          <input type="checkbox" id="toggle-interior" />
          <span>Show interior</span>
        </label>
        <span class="topbar__units">cm</span>
        <button type="button" class="btn btn--tonal" id="open-render" data-testid="open-render">Render</button>
        <button type="button" class="btn btn--primary" id="open-save" data-testid="open-save">Save</button>
        <a class="btn btn--ghost" href="/accessibility.html" lang="he" data-testid="a11y-link">נגישות</a>
      </div>
    </header>
    <div class="banner banner--error" id="error-banner" role="alert" hidden></div>
    <main class="workspace">
      <aside class="panel" id="chat-panel" lang="he" aria-label="מעצב AI"></aside>
      <section class="viewer" id="viewer" aria-label="3D viewer">
        <div class="view-presets" id="view-presets" role="group" aria-label="זווית מצלמה" lang="he" dir="rtl">
          <button type="button" class="btn view-presets__btn" data-view="front">חזית</button>
          <button type="button" class="btn view-presets__btn" data-view="side">צד ימין</button>
          <button type="button" class="btn view-presets__btn" data-view="sideLeft">צד שמאל</button>
          <button type="button" class="btn view-presets__btn" data-view="threeQuarter">3/4</button>
          <button type="button" class="btn view-presets__btn" data-view="reset">איפוס</button>
        </div>
        <button type="button" class="btn view-presets__btn view-rotate" id="auto-rotate" aria-pressed="false" aria-label="סיבוב 360" lang="he" hidden>360</button>
      </section>
      <aside class="panel panel--properties" id="properties-panel" aria-label="Properties" tabindex="-1">
        <h2 class="panel__title">Properties</h2>
        <p class="panel__hint">Select a component in the 3D view, or under All parts below, to edit it.</p>
        <div id="properties-content"></div>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
